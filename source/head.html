<meta name="claude:viewport-fit-sides" content="cover">
<title>Wordsearch Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: sticky nav, hero, generator (Words + Rules above the puzzle, Shape + Export in a sidebar), then content sections.
   Colour: every control role has a highlighter colour that matches the solution overlay on the grid.
   green = add / fill, orange = replace / shape, red = clear, violet = edit / rules, pink = export, teal = shuffle, blue = main actions.
   Bright fills carry dark text, deep blue and violet carry white text, so every pair stays readable. */
:root {
  --bg: #f5f7fc;
  --band: #ebeefc;
  --card: #ffffff;
  --field: #f3f5fb;
  --desk: #e2e7f4;
  --ink: #111827;
  --muted: #56617a;
  --line: #d4dbeb;

  --blue: #2f4df0;   --blue-ink: #ffffff;   --blue-soft: #e2e8ff;
  --violet: #6d3df0; --violet-ink: #ffffff; --violet-soft: #ebe3ff;
  --green: #2bd47a;  --green-ink: #06200f;  --green-soft: #d8f7e6;
  --orange: #ff8a1f; --orange-ink: #2a1300; --orange-soft: #ffe8cf;
  --pink: #ff4d9d;   --pink-ink: #2d0618;   --pink-soft: #ffdbeb;
  --teal: #19c3d1;   --teal-ink: #04262a;   --teal-soft: #d2f4f7;
  --red: #ff6b6b;    --red-ink: #2c0707;    --red-soft: #ffe0e0;
  --yellow: #ffd23f; --yellow-ink: #1d1600;

  --warn: #9a4600; --warn-bg: #fff0dc;
  --foot-bg: #0f1624; --foot-ink: #e2e7f2; --foot-muted: #98a3bb;
  --shadow: 0 1px 2px rgba(17, 24, 39, .08), 0 12px 30px rgba(17, 24, 39, .12);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1017; --band: #121826; --card: #161d2b; --field: #1d2638; --desk: #080b11; --ink: #eef1f8; --muted: #a0aac1; --line: #2c374d;
    --blue: #8aa0ff;   --blue-ink: #0a0f24;   --blue-soft: #232c57;
    --violet: #ab8fff; --violet-ink: #170a35; --violet-soft: #30265a;
    --green: #3ddc84;  --green-soft: #143a2a;
    --orange: #ff9a3d; --orange-soft: #43290d;
    --pink: #ff6aae;   --pink-soft: #4b1b35;
    --teal: #2fd0dd;   --teal-soft: #0f3b41;
    --red: #ff7b7b;    --red-soft: #4b2020;
    --warn: #ffb067; --warn-bg: #3a2a18; --foot-bg: #07090e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1017; --band: #121826; --card: #161d2b; --field: #1d2638; --desk: #080b11; --ink: #eef1f8; --muted: #a0aac1; --line: #2c374d;
  --blue: #8aa0ff;   --blue-ink: #0a0f24;   --blue-soft: #232c57;
  --violet: #ab8fff; --violet-ink: #170a35; --violet-soft: #30265a;
  --green: #3ddc84;  --green-soft: #143a2a;
  --orange: #ff9a3d; --orange-soft: #43290d;
  --pink: #ff6aae;   --pink-soft: #4b1b35;
  --teal: #2fd0dd;   --teal-soft: #0f3b41;
  --red: #ff7b7b;    --red-soft: #4b2020;
  --warn: #ffb067; --warn-bg: #3a2a18; --foot-bg: #07090e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* colour roles: set --k (fill), --ki (text on fill), --ks (soft tint) */
.k-blue   { --k: var(--blue);   --ki: var(--blue-ink);   --ks: var(--blue-soft); }
.k-violet { --k: var(--violet); --ki: var(--violet-ink); --ks: var(--violet-soft); }
.k-green  { --k: var(--green);  --ki: var(--green-ink);  --ks: var(--green-soft); }
.k-orange { --k: var(--orange); --ki: var(--orange-ink); --ks: var(--orange-soft); }
.k-pink   { --k: var(--pink);   --ki: var(--pink-ink);   --ks: var(--pink-soft); }
.k-teal   { --k: var(--teal);   --ki: var(--teal-ink);   --ks: var(--teal-soft); }
.k-red    { --k: var(--red);    --ki: var(--red-ink);    --ks: var(--red-soft); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: clip; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
section[id] { scroll-margin-top: 80px; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--k, var(--blue)); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
h2.title { font: 700 clamp(30px, 4vw, 46px)/1.08 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.eyebrow { align-self: flex-start; font: 700 13px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ki); background: var(--k); padding: 8px 12px; border-radius: 8px; width: fit-content; }
.lead { color: var(--muted); font-size: 18px; max-width: 60ch; }

/* ---- nav ---- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 14px; height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); letter-spacing: -.01em; color: var(--ink); text-decoration: none; min-width: 0; }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { width: 36px; height: 36px; flex: none; }
.mark .bg { fill: var(--blue); }
.mark .dot { fill: var(--blue-ink); opacity: .55; }
.mark .cap { fill: var(--yellow); }
.links { display: flex; gap: 4px; margin-left: auto; }
.links a { padding: 10px 14px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 15px; }
.links a:hover { background: var(--band); }
.nav .btn { flex: none; }
.nav .short { display: none; }
@media (max-width: 860px) { .links { display: none; } .nav .btn { margin-left: auto; } }
@media (max-width: 480px) { .nav .long { display: none; } .nav .short { display: inline; } .brand { font-size: 17px; } .mark { width: 32px; height: 32px; } .nav .wrap { height: 62px; } }

/* ---- buttons and fields ---- */
.btn {
  font: 600 15px/1.1 var(--sans); color: var(--ink); background: var(--ks, var(--card)); border: 2px solid var(--k, var(--line));
  border-radius: 12px; padding: 12px 18px; min-height: 46px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; text-align: center;
  transition: transform .08s, box-shadow .12s, filter .12s;
}
.btn:hover { box-shadow: 0 4px 12px rgba(17, 24, 39, .18); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.solid { background: var(--k); color: var(--ki); }
.btn.small { min-height: 42px; padding: 9px 14px; font-size: 14.5px; }
.btn.big { min-height: 56px; padding: 15px 26px; font-size: 17px; border-radius: 14px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.chipbtn { font: 600 14px var(--sans); color: var(--ink); background: var(--red-soft); border: 2px solid var(--red); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chipbtn:hover { background: var(--red); color: var(--red-ink); }

input[type=text], input[type=number], input[type=password], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 2px solid var(--line);
  border-radius: 12px; padding: 11px 13px; min-height: 48px; min-width: 0; width: 100%;
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus, textarea:focus { border-color: var(--k, var(--blue)); outline: none; box-shadow: 0 0 0 3px var(--ks, var(--blue-soft)); }
input[type=number] { font-variant-numeric: tabular-nums; }
textarea { resize: vertical; font-family: var(--mono); font-size: 15.5px; line-height: 1.6; letter-spacing: .02em; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0; font-weight: 500; }
.hint { font-size: 14px; color: var(--muted); }
.aires { display: flex; flex-wrap: wrap; gap: 8px; }
.aires:empty { display: none; }
.aires button.topic { text-align: left; font: 500 14px/1.35 var(--sans); color: var(--ink); background: var(--field); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer; min-height: 44px; max-width: 100%; }
.aires button.topic:hover, .aires button.topic[aria-pressed="true"] { border-color: var(--k, var(--blue)); background: var(--ks, var(--blue-soft)); }
.aires button.topic small { display: block; color: var(--muted); font-size: 13px; }
.checks input { width: 22px; height: 22px; accent-color: var(--k, var(--blue)); flex: none; }
#bookNotes { font-family: var(--sans); letter-spacing: 0; font-size: 15.5px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
details.adv > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); padding: 4px 0 8px; }
details.adv[open] { display: flex; flex-direction: column; gap: 8px; }
.seg.two2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.std-only[hidden], .one-only[hidden] { display: none !important; }
textarea[dir=rtl] { text-align: right; }

/* big, colour-filled sliders */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; margin: 0; background: transparent; cursor: pointer; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px; background: linear-gradient(to right, var(--k, var(--blue)) var(--p), var(--line) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 50%; background: var(--k, var(--blue)); border: 4px solid var(--card); box-shadow: 0 1px 5px rgba(0, 0, 0, .4); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--k, var(--blue)); }
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--k, var(--blue)); border: 4px solid var(--card); box-shadow: 0 1px 5px rgba(0, 0, 0, .4); }

.switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; position: relative; font-size: 16px; font-weight: 500; min-height: 34px; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; inset: 0; margin: 0; cursor: pointer; }
.switch .track { width: 50px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .15s; }
.switch input:checked + .track { background: var(--k, var(--blue)); }
.switch input:checked + .track::after { transform: translateX(22px); }
.switch input:focus-visible + .track { outline: 3px solid var(--k, var(--blue)); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .45; }

/* ---- hero ---- */
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 56px; align-items: center; padding-block: 52px 44px; }
.hero h1 { font: 700 clamp(38px, 6vw, 70px)/1.12 var(--display); letter-spacing: -.03em; text-wrap: balance; max-width: 14ch; margin-block: 16px 20px; }
.hl { background: var(--yellow); color: var(--yellow-ink); padding: 0 .14em; border-radius: .16em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 26px 0 0; padding: 0; list-style: none; }
.facts li { font-size: 14.5px; font-weight: 500; padding: 7px 13px; border-radius: 999px; background: var(--ks); border: 2px solid var(--k); }
.hero-cv { display: block; width: 280px; height: 280px; background: #fff; border-radius: 6px; box-shadow: var(--shadow); }
@media (max-width: 860px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 36px 28px; } .hero-cv { display: none; } }

/* ---- generator ---- */
.tool { padding-block: 12px 80px; }
.sec-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
.gen { display: grid; grid-template-columns: minmax(0, 1fr) 404px; gap: 24px; align-items: start; }
.main, .side { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.side { gap: 16px; }
.side-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
.side-tabs button { min-width: 0; padding-inline: 8px; font-size: 16px; }

.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1300px) { .setup { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; } }
@media (max-width: 1040px) { .gen { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-t { display: flex; align-items: center; gap: 12px; min-width: 0; }
.badge { width: 42px; height: 42px; border-radius: 12px; background: var(--k); color: var(--ki); display: grid; place-items: center; flex: none; }
.badge svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.card-h h3 { font: 700 22px/1.15 var(--display); letter-spacing: -.01em; }
.meta { font: 500 14px var(--mono); color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.group + .group { border-top: 2px dashed var(--line); padding-top: 20px; }
/* AI panel: groups sit inside a wrapper, so give it the card's own rhythm: 20px, line, 20px. */
#aiWork { display: flex; flex-direction: column; gap: 20px; border-top: 2px dashed var(--line); padding-top: 20px; }
#aiWork > .group + .group { margin-top: 0; }
#panel-ai .group > h4 { margin-bottom: 0; }
#panel-ai .group > .hint { margin: 0; line-height: 1.5; }
#panel-ai label.f { gap: 6px; }
#panel-ai .row { margin: 0; }
#panel-ai details.adv { margin: 0; }
.cover-prev { align-self: flex-start; width: 150px; height: auto; border-radius: 8px; border: 2px solid var(--line); box-shadow: 0 6px 18px rgba(17,24,39,.14); }
details.adv .group, #advType { margin: 0; }
.group h4 { font: 700 12.5px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.group h4 .switch { text-transform: none; letter-spacing: 0; font: 500 15px var(--sans); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.words-card textarea { flex: 1 1 auto; min-height: 190px; }
.slider { display: grid; grid-template-columns: 96px minmax(0, 1fr) 54px; align-items: center; gap: 12px; font-size: 16px; font-weight: 500; }
.slider output { font: 600 17px var(--mono); text-align: right; color: var(--ink); }

.compass { display: grid; grid-template-columns: repeat(3, 56px); gap: 7px; }
.dir { position: relative; }
.dir input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.dir span { display: grid; place-items: center; height: 56px; border-radius: 13px; border: 2px solid var(--line); background: var(--field); font-size: 25px; line-height: 1; transition: background .12s, transform .08s; }
.dir:hover span { border-color: var(--k); }
.dir input:checked + span { background: var(--k); border-color: var(--k); color: var(--ki); }
.dir input:focus-visible + span { outline: 3px solid var(--k); outline-offset: 2px; }
.core { display: grid; place-items: center; font: 700 10px/1.1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dirwrap { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
.dirside { display: flex; flex-direction: column; gap: 10px; flex: 1 1 180px; min-width: 0; }

/* crossings read like a heat scale */
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.seg span { display: grid; place-items: center; min-height: 50px; text-align: center; padding: 8px 4px; border-radius: 12px; font-size: 16px; font-weight: 600; background: var(--ks); border: 2px solid var(--k); color: var(--ink); }
.seg.s2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.s3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.group .seg + h4 { margin-top: 10px; }
.seg label:nth-child(1) { --k: var(--teal);   --ki: var(--teal-ink);   --ks: var(--teal-soft); }
.seg label:nth-child(2) { --k: var(--green);  --ki: var(--green-ink);  --ks: var(--green-soft); }
.seg label:nth-child(3) { --k: var(--orange); --ki: var(--orange-ink); --ks: var(--orange-soft); }
.seg label:nth-child(4) { --k: var(--pink);   --ki: var(--pink-ink);   --ks: var(--pink-soft); }
.seg input:checked + span { background: var(--k); color: var(--ki); box-shadow: 0 4px 12px rgba(17, 24, 39, .2); }
.seg input:focus-visible + span { outline: 3px solid var(--k); outline-offset: 2px; }

/* ---- puzzle card ---- */
.bar { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; justify-content: space-between; }
.tabs { display: inline-grid; grid-auto-flow: column; gap: 6px; }
.tabs button { font: 600 15.5px var(--sans); color: var(--ink); background: var(--ks); border: 2px solid var(--k); padding: 11px 20px; min-height: 48px; border-radius: 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--k); color: var(--ki); box-shadow: 0 4px 12px rgba(17, 24, 39, .2); }
.bar-r { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.desk { background: var(--desk); border-radius: 14px; padding: 18px; display: grid; place-items: center; min-height: 300px; min-width: 0; }
.desk canvas { display: block; max-width: 100%; background: #fff; box-shadow: var(--shadow); border-radius: 4px; }
.desk canvas.paint { cursor: crosshair; touch-action: none; }
.desk canvas.pick { cursor: pointer; }
.lib { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lib li { display: grid; grid-template-columns: auto 64px minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--field); min-width: 0; }
.lib li.on { border-color: var(--k); background: var(--ks); }
.lib .tick { width: 26px; height: 26px; margin: 0; accent-color: var(--k); cursor: pointer; }
.lib canvas.th { width: 64px; height: 64px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: block; }
.lib .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lib .nm { font: 700 16px/1.25 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .nm-in { width: 100%; min-height: 40px; padding: 6px 10px; font-size: 16px; font-weight: 600; }
.lib .meta { font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.lib .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.lib .acts .btn { min-height: 40px; padding: 6px 11px; font-size: 14.5px; }
.lib .acts .btn[data-act=up], .lib .acts .btn[data-act=down] { min-width: 42px; padding-inline: 8px; }
.pages { display: flex; flex-direction: column; gap: 12px; }
